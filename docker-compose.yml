services:
  maestro:
    build: .
    restart: unless-stopped
    # SIGTERM lets a reminder being sent finish and be recorded before the process exits (ADR 0012);
    # the default 10 s is not always enough for one reminder across every channel.
    stop_grace_period: 45s
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - maestro-data:/data

  # Opt in with `docker compose --profile postgres up -d`, and set in .env:
  #   MAESTRO_DB_URL=postgresql://maestro:maestro@db:5432/maestro
  # Without the profile this never starts and Maestro keeps using its SQLite file.
  db:
    image: postgres:16
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro  # only reachable from the compose network; change it anyway
      POSTGRES_DB: maestro
    volumes:
      - maestro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  maestro-data:
  maestro-postgres:
