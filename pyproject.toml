[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro-orchestrator"
dynamic = ["version"]
description = "A personal second brain: capture things to remember in plain language and get reminded at the right time."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sachin Chandani" }]
requires-python = ">=3.11"
dependencies = ["dateparser>=1.2"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["maestro-orchestrator[server]", "pytest>=8", "pytest-cov>=5", "hypothesis>=6", "httpx>=0.27",
       "ruff>=0.6", "mypy>=1.10", "types-dateparser"]

[project.scripts]
maestro = "maestro.cli:main"

[project.urls]
Homepage = "https://github.com/sachin-chandani/maestro-orchestrator"
Changelog = "https://github.com/sachin-chandani/maestro-orchestrator/blob/main/CHANGELOG.md"
Issues = "https://github.com/sachin-chandani/maestro-orchestrator/issues"

[tool.hatch.version]
path = "maestro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["maestro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Leaked files and sockets are bugs. Leaked Store connections are caught explicitly in conftest.py,
    # because sqlite3 only warns about them on 3.13+ and only at garbage collection.
    "error::ResourceWarning",
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx`",
]

[tool.coverage.run]
source = ["maestro"]
branch = true

[tool.coverage.report]
# Ratchet: raise this when coverage goes up, never lower it.
fail_under = 96
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["maestro"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
