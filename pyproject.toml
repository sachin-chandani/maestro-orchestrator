[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro-orchestrator"
dynamic = ["version"]
description = "A personal second brain: capture things to remember in plain language and get reminded at the right time."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sachin Chandani" }]
requires-python = ">=3.11"
dependencies = ["dateparser>=1.2"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["maestro-orchestrator[server]", "pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
maestro = "maestro.cli:main"

[project.urls]
Homepage = "https://github.com/sachin-chandani/maestro-orchestrator"
Changelog = "https://github.com/sachin-chandani/maestro-orchestrator/blob/main/CHANGELOG.md"
Issues = "https://github.com/sachin-chandani/maestro-orchestrator/issues"

[tool.hatch.version]
path = "maestro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["maestro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
